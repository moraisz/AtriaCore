name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atria
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: atria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: atria
          MYSQL_USER: atria
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uatria -psecret --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, mysqli, sqlite3
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit dependencies
        run: composer audit

      - name: Check code style
        run: composer cs-check

      - name: Run PHPStan
        run: composer phpstan

      - name: Run tests
        run: composer test
        env:
          DB_TEST_PGSQL_HOST: 127.0.0.1
          DB_TEST_PGSQL_PORT: 5432
          DB_TEST_PGSQL_DATABASE: atria
          DB_TEST_PGSQL_USERNAME: atria
          DB_TEST_PGSQL_PASSWORD: secret
          DB_TEST_MYSQL_HOST: 127.0.0.1
          DB_TEST_MYSQL_PORT: 3306
          DB_TEST_MYSQL_DATABASE: atria
          DB_TEST_MYSQL_USERNAME: atria
          DB_TEST_MYSQL_PASSWORD: secret
