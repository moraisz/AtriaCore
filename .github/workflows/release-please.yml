name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Create release PR or release
    runs-on: ubuntu-latest

    steps:
      - name: Create release PR or release
        uses: googleapis/release-please-action@v4
        with:
          release-type: php
          bump-minor-pre-major: true
          token: ${{ secrets.GITHUB_TOKEN }}
