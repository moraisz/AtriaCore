# Local copy of .github/workflows/quality.yml: run it with `composer ci`,
# clean up with `composer ci-down`. Images, credentials and health checks
# match the workflow's services.
name: atria-core-ci

services:
  php:
    build:
      context: docker/ci
    # Your user, so vendor/ and caches written through the mount stay yours.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./:/app
      - composer-cache:/tmp/composer
    environment:
      DB_TEST_PGSQL_HOST: postgres
      DB_TEST_PGSQL_PORT: 5432
      DB_TEST_PGSQL_DATABASE: atria
      DB_TEST_PGSQL_USERNAME: atria
      DB_TEST_PGSQL_PASSWORD: secret
      DB_TEST_MYSQL_HOST: mysql
      DB_TEST_MYSQL_PORT: 3306
      DB_TEST_MYSQL_DATABASE: atria
      DB_TEST_MYSQL_USERNAME: atria
      DB_TEST_MYSQL_PASSWORD: secret
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: atria
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: atria
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: atria
      MYSQL_USER: atria
      MYSQL_PASSWORD: secret
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uatria -psecret --silent"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  composer-cache:
